name: Check Harmony
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check source export
        run: python3 tools/check-release.py .
      - name: Test and typecheck
        run: make check
