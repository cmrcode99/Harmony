name: Feature request
description: Suggest a focused improvement.
title: "Idea: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user experience and any effect on focus sessions or recovery.
    validations:
      required: true
